services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildtogether-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_PROXY_TARGET=http://backend:8080
      - DOCKER=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend

  backend:
    image: eclipse-temurin:21-jdk
    container_name: buildtogether-backend
    working_dir: /workspace
    command: >
      sh -c "echo 'Backend service expected at http://backend:8080'; sleep infinity"
    expose:
      - "8080"
